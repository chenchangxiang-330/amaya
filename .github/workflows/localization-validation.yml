name: Localization validation (fork only)
on:
  push:
    branches: [codex/localization-validation]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ba4fbc02b344649569a0faeb12a71e51bb53f46d
jobs:
  localization:
    if: github.repository == 'chenchangxiang-330/amaya'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: validation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false
      - name: Record source and check resources
        run: |
          mkdir -p validation
          git rev-parse HEAD | tee validation/source-sha.txt
          git status --porcelain --untracked-files=no | tee validation/source-status.txt
          java -version 2>&1 | tee validation/java.txt
          python3 harness/validation/check_resources.py | tee validation/resources.txt
      - name: Build debug ARM APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee validation/build.log
          sha256sum app/build/outputs/apk/debug/*arm64-v8a*.apk | tee validation/apk-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-arm64-v8a-debug.apk | tee validation/signature.txt
      - name: Unit tests and lint
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug --continue --stacktrace --console=plain 2>&1 | tee validation/checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localization-checks
          retention-days: 30
          path: |
            validation/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/output-metadata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amaya-1.0.3-debug-arm64-v8a
          retention-days: 30
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: validation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false
      - name: Prepare fork-only UI checks
        run: |
          mkdir -p app/src/androidTest/java/com/amaya/intelligence/localization validation
          cp harness/validation/LocalizationSmokeTest.kt app/src/androidTest/java/com/amaya/intelligence/localization/
          cp harness/validation/run-emulator-checks.sh validation/
          git rev-parse HEAD | tee validation/source-sha.txt
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Build x86_64 debug and instrumentation APKs
        run: |
          set -o pipefail
          gradle -I harness/validation/emulator.init.gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -Pkotlin.compiler.execution.strategy=in-process --no-configuration-cache --stacktrace --console=plain 2>&1 | tee validation/emulator-build.log
          free -m | tee validation/memory-before-emulator.txt
      - name: Exercise real Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash validation/run-emulator-checks.sh
      - name: Collect available runtime evidence
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p validation/runtime
          find validation/runtime -type f -name '*-result.txt' -exec cat {} \;
          sudo dmesg --ctime | grep -Ei 'out of memory|killed process|oom' | tee validation/runtime/host-memory-events.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}-screenshots-and-logs
          retention-days: 30
          path: validation/
  evidence:
    needs: [localization, emulator]
    if: always() && github.repository == 'chenchangxiang-330/amaya' && needs.localization.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: emulator-api-*-screenshots-and-logs
          path: /tmp/amaya-ui-evidence
      - name: Preserve screenshots in the fork evidence branch
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin codex/localization-evidence >/dev/null; then
            git fetch origin codex/localization-evidence
            git checkout -B codex/localization-evidence FETCH_HEAD
          else
            git fetch origin main
            git checkout -b codex/localization-evidence FETCH_HEAD
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, json
          dest = Path('validation/evidence') / os.environ['SOURCE_SHA']
          for artifact in Path('/tmp/amaya-ui-evidence').iterdir():
              api = artifact.name.split('-')[2]
              target = dest / ('api-' + api)
              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True, exist_ok=True)
              for source in artifact.rglob('*'):
                  if source.is_file() and (source.suffix in ('.png', '.xml') or source.name.endswith('-result.txt') or source.name == 'host-memory-events.txt'):
                      shutil.copy2(source, target / source.name)
          dest.mkdir(parents=True, exist_ok=True)
          (dest / 'source.json').write_text(json.dumps({'source_sha': os.environ['SOURCE_SHA'], 'run': os.environ['RUN_URL'], 'variant': 'debug', 'emulator_abi': 'x86_64', 'phone_abi': 'arm64-v8a', 'live_model_response_tested': False}, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/evidence
          if ! git diff --cached --quiet; then
            git commit -m "Record cloud UI evidence for $SOURCE_SHA [skip ci]"
            git push origin HEAD:codex/localization-evidence
          fi
