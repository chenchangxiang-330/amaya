name: Localization validation (fork only)
on:
  push:
    branches: [codex/localization-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    if: github.repository == 'chenchangxiang-330/amaya'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb942fed9b9e0a77cc956660804d422fc19bfaa3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Record localization source
        run: |
          mkdir -p validation
          git rev-parse HEAD | tee validation/source-sha.txt
          git status --porcelain --untracked-files=no | tee validation/source-status.txt
          java -version 2>&1 | tee validation/java.txt
      - name: Build debug ARM APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee validation/build.log
      - name: Unit tests and lint
        if: success()
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug --continue --stacktrace --console=plain 2>&1 | tee validation/checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simplified-chinese-debug
          retention-days: 30
          path: |
            validation/
            app/build/reports/
            app/build/outputs/apk/debug/
