name: Localization validation (fork only)
on:
  push:
    branches: [codex/localization-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'chenchangxiang-330/amaya'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbc1f1e79744bacc60ad5ba5ba51d08570c66521
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Record unmodified upstream source
        run: |
          mkdir -p validation
          git rev-parse HEAD | tee validation/source-sha.txt
          git status --porcelain | tee validation/source-status.txt
          java -version 2>&1 | tee validation/java.txt
      - name: Build debug ARM APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee validation/build.log
      - name: Unit tests and lint
        if: success()
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug --continue --stacktrace --console=plain 2>&1 | tee validation/checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unmodified-upstream-baseline
          retention-days: 30
          path: |
            validation/
            app/build/reports/
            app/build/outputs/apk/debug/
